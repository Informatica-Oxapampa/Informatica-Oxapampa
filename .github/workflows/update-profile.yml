name: Actualizar catálogo institucional

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-profile.yml"
      - "scripts/generate_profile.py"
      - "README.template.md"
      - "assets/banner.svg"
      - "assets/icono-repositorio.svg"

permissions:
  contents: write

concurrency:
  group: actualizar-perfil-institucional
  cancel-in-progress: true

jobs:
  actualizar:
    name: Detectar repositorios y actualizar perfil
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar catálogo dinámico
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACCOUNT: Informatica-Oxapampa
        run: python scripts/generate_profile.py

      - name: Publicar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/lenguajes.svg

          if git diff --cached --quiet; then
            echo "El perfil ya está actualizado."
            exit 0
          fi

          git commit -m "chore: actualiza catálogo institucional"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
